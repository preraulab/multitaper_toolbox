[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "multitaper_rs"
version = "0.1.0"
description = "Rust-accelerated multitaper spectrogram kernel"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Build the Python extension only (not the CLI binary). The CLI is still
# built via `cargo build --release`.
bindings = "pyo3"
features = ["python"]
# abi3 wheels are universal across Python 3.8+
